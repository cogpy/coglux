# CogLux Release Build Workflow
name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  BUILD_TYPE: Release

jobs:
  # ============================================
  # Version Preparation
  # ============================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

  # ============================================
  # Linux Release
  # ============================================
  linux-release:
    name: Linux Release
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTS=ON
          cmake --build build

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Create package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release/coglux-${VERSION}-linux-x64
          
          cp build/libcoglux.* release/coglux-${VERSION}-linux-x64/ 2>/dev/null || true
          cp -r include release/coglux-${VERSION}-linux-x64/
          cp README.md release/coglux-${VERSION}-linux-x64/
          
          cd release
          tar -czvf coglux-${VERSION}-linux-x64.tar.gz coglux-${VERSION}-linux-x64
          sha256sum coglux-${VERSION}-linux-x64.tar.gz > coglux-${VERSION}-linux-x64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coglux-linux-release
          path: |
            release/*.tar.gz
            release/*.sha256
          retention-days: 30

  # ============================================
  # Windows Release
  # ============================================
  windows-release:
    name: Windows Release
    runs-on: windows-latest
    needs: prepare
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON
          cmake --build build --config Release

      - name: Run tests
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      - name: Create package
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "release/coglux-${VERSION}-windows-x64"
          
          Copy-Item build/Release/* "release/coglux-${VERSION}-windows-x64/" -ErrorAction SilentlyContinue
          Copy-Item -Recurse include "release/coglux-${VERSION}-windows-x64/"
          Copy-Item README.md "release/coglux-${VERSION}-windows-x64/"
          
          Compress-Archive -Path "release/coglux-${VERSION}-windows-x64" -DestinationPath "release/coglux-${VERSION}-windows-x64.zip"
          Get-FileHash "release/coglux-${VERSION}-windows-x64.zip" -Algorithm SHA256 | Format-List > "release/coglux-${VERSION}-windows-x64.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coglux-windows-release
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 30

  # ============================================
  # macOS Release
  # ============================================
  macos-release:
    name: macOS Release
    runs-on: macos-latest
    needs: prepare
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON
          cmake --build build

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Create package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release/coglux-${VERSION}-macos-arm64
          
          cp build/libcoglux.* release/coglux-${VERSION}-macos-arm64/ 2>/dev/null || true
          cp -r include release/coglux-${VERSION}-macos-arm64/
          cp README.md release/coglux-${VERSION}-macos-arm64/
          
          cd release
          tar -czvf coglux-${VERSION}-macos-arm64.tar.gz coglux-${VERSION}-macos-arm64
          shasum -a 256 coglux-${VERSION}-macos-arm64.tar.gz > coglux-${VERSION}-macos-arm64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coglux-macos-release
          path: |
            release/*.tar.gz
            release/*.sha256
          retention-days: 30

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, linux-release, windows-release, macos-release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: CogLux v${{ needs.prepare.outputs.version }}
          body: |
            ## CogLux Release v${{ needs.prepare.outputs.version }}
            
            A cognitive computing library with Lux integration.
            
            ### Downloads
            - **Linux x64**: `coglux-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz`
            - **Windows x64**: `coglux-${{ needs.prepare.outputs.version }}-windows-x64.zip`
            - **macOS ARM64**: `coglux-${{ needs.prepare.outputs.version }}-macos-arm64.tar.gz`
            
            ### Installation
            ```bash
            tar -xzvf coglux-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
            ```
          files: |
            release/**/*.tar.gz
            release/**/*.zip
            release/**/*.sha256
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
